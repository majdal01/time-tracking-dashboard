<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">  

  <link rel="stylesheet" href="./SCSS/style.css">
  
  <title>Frontend Mentor | Time tracking dashboard</title>

</head>
<body>
  <main id="main">

    <div class="grid-container">

      <section class="profile-card">
        <div  class="profile-information">
          <div id="profile-img">
            <img src="images/image-jeremy.png" alt="Jeremy Robson">
          </div>
          <div id="profile-name">
            <h1>Report for</h1>
            <h2>Jeremy Robson</h2>
          </div>
        </div>

        <div class="timeframe-buttons">
          <button>Daily</button>
          <button>Weekly</button>
          <button>Monthly</button>
        </div>
      </section>

      <section class="card-background" id="work">
        <div class="card-container">
          <div class="card-header">
            <h3>Work</h3> 
            <span class="dots">...</span>
          </div>
          <h4>5hrs</h4> <!-- daily -->
          <p>Previous - 7hrs</p> <!-- daily -->
          <!--
          <h4>32hrs</h4>
          <p>Previous - 36hrs</p>
          <h4>103hrs</h4> 
          <p>Previous - 128hrs</p>
        -->
        </div>
      </section>

      <section class="card-background" id="play">
        <div class="card-container">
          <div class="card-header">
            <h3>Play</h3>
            <span class="dots">...</span>
          </div>
          <h4>1hr</h4> <!-- daily -->
          <p>Previous - 2hrs</p> <!-- daily -->
          <!--
          <h4>10hrs</h4> 
          <p>Previous - 8hrs</p> 
          <h4>23hrs</h4> 
          <p>Previous - 29hrs</p>
          -->
        </div>
      </section>

      <section class="card-background" id="study">
        <div class="card-container">
          <div class="card-header">
            <h3>Study</h3>
            <span class="dots">...</span>
          </div>
          <h4>0hrs</h4> <!-- daily -->
          <p>Previous - 1hr</p> <!-- daily -->
          <!--
          <h4>4hrs</h4> 
          <p>Previous - 7hrs</p> 
          <h4>13hrs</h4> 
          <p>Previous - 19hrs</p> 
          -->
        </div>
      </section>

      <section class="card-background" id="exercise">
        <div class="card-container">
          <div class="card-header">
            <h3>Exercise</h3>
            <span class="dots">...</span>
          </div>
          <h4>1hr</h4> <!-- daily -->
          <p>Previous - 1hr</p> <!-- daily -->
          <!--
          <h4>4hrs</h4> 
          <p>Previous - 5hrs</p>
          <h4>11hrs</h4> 
          <p>Previous - 18hrs</p>
          -->
        </div>
      </section>

      <section class="card-background" id="social">
        <div class="card-container">
          <div class="card-header">
            <h3>Social</h3>
            <span class="dots">...</span>
          </div>
          <h4>1hr</h4> <!-- daily -->
          <p>Previous - 3hrs</p> <!-- daily -->
          <!--
          <h4>5hrs</h4> 
          <p>Previous - 10hrs</p>
          <h4>21hrs</h4>
          <p>Previous - 23hrs</p>
          -->
        </div>
      </section>

      <section class="card-background" id="self-care">
        <div class="card-container">
          <div class="card-header">
            <h3>Self Care</h3>
            <span class="dots">...</span>
          </div>
          <h4>0hrs</h4> <!-- daily -->
          <p>Previous - 1hr</p> <!-- daily -->
          <!--
          <h4>2hrs</h4> 
          <p>Previous - 2hrs</p> 
          <h4>7hrs</h4>
          <p>Previous - 11hrs</p>
          -->
        </div>
      </section>

    </div>

  </main>
  
</body>
</html>
