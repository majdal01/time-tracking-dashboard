<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">  

  <link rel="stylesheet" href="./SCSS/style.css">

  <script src="./scripts/script.js" defer></script>
  
  <title>Frontend Mentor | Time tracking dashboard</title>

</head>
<body>
  <main id="main">

    <div class="grid-container">

      <section class="profile-card">
        <div  class="profile-information">
          <div id="profile-img">
            <img src="images/image-jeremy.png" alt="Jeremy Robson">
          </div>
          <div id="profile-name">
            <h1>Report for</h1>
            <h2>Jeremy Robson</h2>
          </div>
        </div>

        <div class="timeframe-buttons">
          <button id="daily-btn">Daily</button>
          <button id="weekly-btn">Weekly</button>
          <button id="monthly-btn">Monthly</button>
        </div>
      </section>

      <section class="card-background" id="work">
        <div class="card-container">
          <button class="card-header">
            <h3>Work</h3> 
            <svg class="dots" aria-hidden="true" width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill-rule="evenodd"/></svg>
          </button>
          <div class="data">
            <h4>Hours</h4>
            <p></p> 
          </div>
        </div>
      </section>

      <section class="card-background" id="play">
        <div class="card-container">
          <button class="card-header">
            <h3>Play</h3>
            <svg class="dots" aria-hidden="true" width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill-rule="evenodd"/></svg>
          </button>
          <div class="data">
            <h4>Hours</h4>
            <p></p> 
          </div>
        </div>
      </section>

      <section class="card-background" id="study">
        <div class="card-container">
          <button class="card-header">
            <h3>Study</h3>
            <svg class="dots" aria-hidden="true" width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill-rule="evenodd"/></svg>
          </button>
          <div class="data">
            <h4>Hours</h4>
            <p></p> 
          </div>
        </div>
      </section>

      <section class="card-background" id="exercise">
        <div class="card-container">
          <button class="card-header">
            <h3>Exercise</h3>
            <svg class="dots" aria-hidden="true" width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill-rule="evenodd"/></svg>
          </button>
          <div class="data">
            <h4>Hours</h4>
            <p></p> 
          </div>
        </div>
      </section>

      <section class="card-background" id="social">
        <div class="card-container">
          <button class="card-header">
            <h3>Social</h3>
            <svg class="dots" aria-hidden="true" width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill-rule="evenodd"/></svg>
          </button>
          <div class="data">
            <h4>Hours</h4>
            <p></p>
          </div>
        </div>
      </section>

      <section class="card-background" id="self-care">
        <div class="card-container">
          <button class="card-header">
            <h3>Self Care</h3>
            <svg class="dots" aria-hidden="true" width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill-rule="evenodd"/></svg>
          </button>
          <div class="data">
            <h4>Hours</h4>
            <p></p>
          </div>
        </div>
      </section>

    </div>

  </main>
  
</body>
</html>
